<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPS AI</title>

<style>
:root {
    --bg: #03070c;
    --panel: #08121b;
    --cyan: #42f5ef;
    --blue: #3a9cff;
    --purple: #a78bfa;
    --text: #e9f7ff;
    --muted: #7f9ba9;
    --line: rgba(66, 245, 239, 0.22);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background:
        radial-gradient(circle at 50% 10%, rgba(58,156,255,0.10), transparent 35%),
        radial-gradient(circle at 50% 50%, rgba(66,245,239,0.05), transparent 60%),
        var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

#system {
    width: 100%;
    max-width: 430px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin: 40px 0 8px;
    color: var(--cyan);
    font-size: clamp(34px, 10vw, 43px);
    letter-spacing: 5px;
    text-align: center;
    text-shadow: 0 0 18px rgba(66,245,239,0.45);
}

#subtitle {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 4px;
}

#accent-line {
    width: 48px;
    height: 2px;
    margin: 20px 0 28px;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    box-shadow: 0 0 12px var(--cyan);
}

/* 채팅 입력 영역 */

#input-area {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
}

#search {
    flex: 1;
    min-width: 0;
    min-height: 50px;
    max-height: 120px;
    resize: none;
    overflow-y: auto;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 17px;
    outline: none;
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    line-height: 20px;
}

#search:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(66,245,239,0.12);
}

#search::placeholder {
    color: var(--muted);
}

#starting-button {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid var(--cyan);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(66,245,239,0.16), rgba(58,156,255,0.16));
    color: var(--cyan);
    cursor: pointer;
}

#starting-button svg {
    width: 22px;
    height: 22px;
}

/* 채팅창 */

#chatbox {
    width: 100%;
    height: 350px;
    margin-top: 18px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 18px;
    background:
        radial-gradient(circle at 50% 0%, rgba(58,156,255,0.08), transparent 50%),
        linear-gradient(180deg, rgba(8,18,27,0.96), rgba(3,7,12,0.98));
}

/* 첫 화면에는 아이콘만 중앙에 표시 */

#welcome {
    flex: 1;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#welcome-icon {
    color: var(--cyan);
    font-size: 38px;
    line-height: 1;
    text-shadow:
        0 0 10px rgba(66,245,239,0.8),
        0 0 28px rgba(66,245,239,0.4);
}

/* 메시지 디자인 */

.message {
    max-width: 85%;
    padding: 11px 14px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user-message {
    align-self: flex-end;
    color: #031016;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border-radius: 15px 15px 4px 15px;
}

.ai-message {
    align-self: flex-start;
    color: var(--text);
    background: linear-gradient(135deg, rgba(58,156,255,0.14), rgba(167,139,250,0.12));
    border: 1px solid rgba(58,156,255,0.2);
    border-radius: 15px 15px 15px 4px;
}

/* AI가 답변하는 사이트 링크 */

.ai-link {
    color: var(--cyan);
    text-decoration: underline;
    text-decoration-color: var(--cyan);
    text-underline-offset: 4px;
    overflow-wrap: anywhere;
    cursor: pointer;
}

.ai-link:hover {
    color: white;
    text-shadow: 0 0 10px var(--cyan);
}

/* 공통 창 */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 18px;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(8px);
}

.overlay.active {
    display: flex;
}

.window {
    width: 100%;
    max-width: 430px;
    max-height: 85vh;
    overflow: auto;
    padding: 20px;
    border: 1px solid var(--cyan);
    border-radius: 16px;
    background: #061019;
    box-shadow: 0 0 25px rgba(66,245,239,0.12);
}

.window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.window-header h2 {
    margin: 0;
    color: var(--cyan);
    font-size: 18px;
    letter-spacing: 2px;
}

.close-button {
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--cyan);
    font-size: 20px;
    cursor: pointer;
}

/* 비밀번호 창 */

#password-window {
    max-width: 220px;
    padding: 20px;
}

#password-input {
    width: 100%;
    height: 44px;
    border: 1px solid var(--cyan);
    border-radius: 10px;
    outline: none;
    background: #03070c;
    color: var(--cyan);
    text-align: center;
    letter-spacing: 9px;
    font-size: 20px;
}

/* 데이터 관리창 */

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
}

.field input,
.field select,
.field textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
    background: #03070c;
    color: var(--text);
    font: inherit;
}

.field textarea {
    min-height: 75px;
    resize: vertical;
}

.action-button {
    min-height: 40px;
    padding: 10px 14px;
    border: 1px solid var(--cyan);
    border-radius: 9px;
    background: rgba(66,245,239,0.08);
    color: var(--cyan);
    cursor: pointer;
}

.action-button:hover {
    background: rgba(66,245,239,0.16);
}

#data-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 20px;
}

.data-item {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(255,255,255,0.02);
    overflow-wrap: anywhere;
}

.data-item strong {
    color: var(--cyan);
}

.data-item p {
    margin: 7px 0;
    font-size: 13px;
    white-space: pre-wrap;
}

.data-item button {
    margin-top: 5px;
}

.data-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}

/* 터미널 */

#terminal-output {
    min-height: 130px;
    max-height: 300px;
    overflow-y: auto;
    padding: 12px;
    border: 1px solid rgba(66,245,239,0.18);
    border-radius: 8px;
    background: #020604;
    color: #7dff9b;
    font: 13px/1.6 monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

#terminal-input {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid rgba(66,245,239,0.3);
    border-radius: 8px;
    outline: none;
    background: #020604;
    color: #7dff9b;
    font: 14px monospace;
}

@media (max-width: 480px) {
    body {
        padding: 18px 12px;
    }

    h1 {
        margin-top: 32px;
    }

    #chatbox {
        height: 330px;
    }
}
</style>
</head>

<body>

<main id="system">

    <h1>BUPSENT</h1>
    <div id="subtitle">NEURAL INTERFACE</div>
    <div id="accent-line"></div>

    <form id="input-area">
        <textarea id="search" placeholder="메시지를 입력하세요..." rows="1"></textarea>

        <button id="starting-button" type="submit" aria-label="전송">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
        </button>
    </form>

    <section id="chatbox" aria-live="polite">
        <div id="welcome">
            <div id="welcome-icon">◈</div>
        </div>
    </section>

</main>

<!-- 비밀번호 창 -->

<div class="overlay" id="password-overlay">
    <div class="window" id="password-window">
        <input
            id="password-input"
            type="password"
            inputmode="text"
            maxlength="4"
            autocomplete="off"
            aria-label="비밀번호"
        >
    </div>
</div>

<!-- 데이터 관리창 -->

<div class="overlay" id="data-overlay">
    <section class="window">
        <header class="window-header">
            <h2>BPS DATA</h2>
            <button class="close-button" data-close="data-overlay" aria-label="닫기">&times;</button>
        </header>

        <div class="field">
            <label for="data-type">TYPE</label>
            <select id="data-type">
                <option value="word">WORD</option>
                <option value="sentence">SENTENCE</option>
                <option value="knowledge">KNOWLEDGE</option>
            </select>
        </div>

        <div class="field">
            <label for="data-content">CONTENT</label>
            <textarea id="data-content" placeholder="예: 네이버"></textarea>
        </div>

        <div class="field">
            <label for="data-meaning">MEANING</label>
            <textarea id="data-meaning" placeholder="예: www.naver.com"></textarea>
        </div>

        <button class="action-button" id="save-data-button">SAVE DATA</button>

        <div class="data-actions">
            <button class="action-button" id="export-data-button">EXPORT JSON</button>
        </div>

        <div id="data-list"></div>
    </section>
</div>

<!-- 터미널 창 -->

<div class="overlay" id="terminal-overlay">
    <section class="window">
        <header class="window-header">
            <h2>BPS CONSOLE</h2>
            <button class="close-button" data-close="terminal-overlay" aria-label="닫기">&times;</button>
        </header>

        <div id="terminal-output">BPS CONSOLE READY
help - 명령어 목록
clear - 화면 지우기
data - 저장된 데이터 개수 확인</div>

        <input id="terminal-input" type="text" placeholder="명령어 입력..." autocomplete="off">
    </section>
</div>

<script>
const searchInput = document.getElementById("search");
const chatbox = document.getElementById("chatbox");
const inputArea = document.getElementById("input-area");

const passwordOverlay = document.getElementById("password-overlay");
const passwordInput = document.getElementById("password-input");

const dataOverlay = document.getElementById("data-overlay");
const terminalOverlay = document.getElementById("terminal-overlay");

const dataContent = document.getElementById("data-content");
const dataMeaning = document.getElementById("data-meaning");
const dataType = document.getElementById("data-type");
const dataList = document.getElementById("data-list");

const terminalOutput = document.getElementById("terminal-output");
const terminalInput = document.getElementById("terminal-input");

const STORAGE_KEY = "BUPSENT_DATA_V1";
const PASSWORD = "3868";

let pendingDestination = "";
let lastFocusedElement = null;

/* 저장된 데이터 불러오기 */

function getStoredData() {
    try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(stored) ? stored : [];
    } catch (error) {
        return [];
    }
}

/* 저장된 데이터 기록하기 */

function setStoredData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* 처음 화면 아이콘 */

function showWelcome() {
    if (chatbox.querySelector(".message")) {
        return;
    }

    if (!document.getElementById("welcome")) {
        const welcome = document.createElement("div");
        welcome.id = "welcome";

        const icon = document.createElement("div");
        icon.id = "welcome-icon";
        icon.textContent = "◈";

        welcome.appendChild(icon);
        chatbox.appendChild(welcome);
    }
}

/* 메시지 추가 */

function addMessage(text, type) {
    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    /*
      AI 답변에서만 웹사이트 주소를 링크로 변환한다.
      사용자 메시지는 HTML로 해석하지 않고 일반 텍스트로 표시한다.
    */

    if (type === "ai-message") {
        renderAIResponse(message, text);
    } else {
        message.textContent = text;
    }

    chatbox.prepend(message);
}

/* 웹사이트 주소인지 확인 */

function getWebsiteURL(text) {
    const value = text.trim();

    if (!value) {
        return null;
    }

    /*
      http://, https://, www. 주소 또는 일반 도메인 형식을 확인한다.
      예: www.naver.com
      예: naver.com
      예: https://www.naver.com
    */

    const hasProtocol = /^https?:\/\//i.test(value);
    const looksLikeDomain =
        /^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(?::\d{1,5})?(\/[^\s]*)?$/i.test(value);

    if (!hasProtocol && !looksLikeDomain) {
        return null;
    }

    const urlText = hasProtocol ? value : "https://" + value;

    try {
        const url = new URL(urlText);

        if (url.protocol !== "http:" && url.protocol !== "https:") {
            return null;
        }

        if (!url.hostname.includes(".")) {
            return null;
        }

        return url.href;
    } catch (error) {
        return null;
    }
}

/* AI 답변 표시: 주소면 클릭 가능한 링크 */

function renderAIResponse(container, text) {
    const url = getWebsiteURL(text);

    if (url) {
        const link = document.createElement("a");

        link.className = "ai-link";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = text.trim();

        container.appendChild(link);
        return;
    }

    container.textContent = text;
}

/* CONTENT와 일치하는 데이터의 MEANING 찾기 */

function findSavedMeaning(userText) {
    const data = getStoredData();
    const normalizedInput = userText.trim().toLocaleLowerCase();

    if (!normalizedInput) {
        return null;
    }

    const matched = data.find(item => {
        if (
            typeof item.content !== "string" ||
            typeof item.meaning !== "string"
        ) {
            return false;
        }

        return item.content.trim().toLocaleLowerCase() === normalizedInput;
    });

    return matched ? matched.meaning : null;
}

/* AI 답변 결정 */

function getAIResponse(userText) {
    const input = userText.trim();

    if (!input) {
        return "";
    }

    /*
      명령어를 먼저 검사한다.
      그래야 /bps data와 /bps console이 정상 작동한다.
    */

    if (input === "/bps data") {
        pendingDestination = "data-overlay";
        openPasswordWindow();
        return "";
    }

    if (input === "/bps console") {
        pendingDestination = "terminal-overlay";
        openPasswordWindow();
        return "";
    }

    /*
      사용자가 입력한 단어와 CONTENT가 일치하면
      저장된 MEANING을 그대로 답변한다.
    */

    const savedMeaning = findSavedMeaning(input);

    if (savedMeaning !== null) {
        return savedMeaning;
    }

    if (input.toLowerCase() === "bps") {
        return "BPS AI 시스템에 접속했습니다.";
    }

    return "아직 저장된 답변이 없습니다.";
}

/* 메시지 전송 */

function askAI() {
    const text = searchInput.value.trim();

    if (!text) {
        return;
    }

    addMessage(text, "user-message");

    searchInput.value = "";
    searchInput.style.height = "50px";

    const response = getAIResponse(text);

    if (response) {
        addMessage(response, "ai-message");
    }
}

inputArea.addEventListener("submit", function(event) {
    event.preventDefault();
    askAI();
});

searchInput.addEventListener("keydown", function(event) {
    if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
    ) {
        event.preventDefault();
        askAI();
    }
});

searchInput.addEventListener("input", function() {
    this.style.height = "50px";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

/* 비밀번호 창 열기 */

function openPasswordWindow() {
    lastFocusedElement = document.activeElement;
    passwordInput.value = "";
    passwordOverlay.classList.add("active");

    setTimeout(function() {
        passwordInput.focus();
    }, 50);
}

/* 비밀번호 검사 */

passwordInput.addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 4);
});

passwordInput.addEventListener("keydown", function(event) {
    if (event.key !== "Enter") {
        return;
    }

    event.preventDefault();

    if (passwordInput.value.length !== 4) {
        return;
    }

    if (passwordInput.value !== PASSWORD) {
        passwordInput.value = "";
        return;
    }

    passwordOverlay.classList.remove("active");

    if (pendingDestination === "data-overlay") {
        dataOverlay.classList.add("active");
        renderDataList();
    } else if (pendingDestination === "terminal-overlay") {
        terminalOverlay.classList.add("active");
        terminalInput.focus();
    }

    pendingDestination = "";
});

/* 창 닫기 */

function closeOverlay(overlay) {
    overlay.classList.remove("active");

    if (overlay === passwordOverlay) {
        pendingDestination = "";
    }

    if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
        lastFocusedElement.focus();
    }
}

document.querySelectorAll("[data-close]").forEach(button => {
    button.addEventListener("click", function() {
        const overlay = document.getElementById(this.dataset.close);
        closeOverlay(overlay);
    });
});

[passwordOverlay, dataOverlay, terminalOverlay].forEach(overlay => {
    overlay.addEventListener("click", function(event) {
        if (event.target === overlay) {
            closeOverlay(overlay);
        }
    });
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        [passwordOverlay, dataOverlay, terminalOverlay].forEach(overlay => {
            if (overlay.classList.contains("active")) {
                closeOverlay(overlay);
            }
        });
    }
});

/* 데이터 저장 */

document.getElementById("save-data-button").addEventListener("click", function() {
    const content = dataContent.value.trim();
    const meaning = dataMeaning.value.trim();
    const type = dataType.value;

    if (!content || !meaning) {
        alert("CONTENT와 MEANING을 모두 입력해 주세요.");
        return;
    }

    const data = getStoredData();

    const existingIndex = data.findIndex(item =>
        item.type === type &&
        item.content.trim().toLocaleLowerCase() === content.toLocaleLowerCase()
    );

    const newItem = {
        type: type,
        content: content,
        meaning: meaning,
        updatedAt: new Date().toISOString()
    };

    if (existingIndex >= 0) {
        data[existingIndex] = newItem;
    } else {
        data.push(newItem);
    }

    try {
        setStoredData(data);

        dataContent.value = "";
        dataMeaning.value = "";

        renderDataList();
    } catch (error) {
        alert("저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.");
    }
});

/* 저장 데이터 목록 */

function renderDataList() {
    const data = getStoredData();
    dataList.replaceChildren();

    if (data.length === 0) {
        const empty = document.createElement("p");
        empty.style.color = "var(--muted)";
        empty.style.fontSize = "13px";
        empty.textContent = "저장된 데이터가 없습니다.";

        dataList.appendChild(empty);
        return;
    }

    data.slice().reverse().forEach(item => {
        const card = document.createElement("div");
        card.className = "data-item";

        const typeLabel = document.createElement("strong");
        typeLabel.textContent = String(item.type || "").toUpperCase();

        const content = document.createElement("p");
        content.textContent = "CONTENT: " + item.content;

        const meaning = document.createElement("p");
        meaning.textContent = "MEANING: " + item.meaning;

        const deleteButton = document.createElement("button");
        deleteButton.className = "action-button";
        deleteButton.textContent = "DELETE";

        deleteButton.addEventListener("click", function() {
            const currentData = getStoredData();

            const index = currentData.findIndex(entry =>
                entry.type === item.type &&
                entry.content === item.content &&
                entry.meaning === item.meaning
            );

            if (index !== -1) {
                currentData.splice(index, 1);
                setStoredData(currentData);
                renderDataList();
            }
        });

        card.append(typeLabel, content, meaning, deleteButton);
        dataList.appendChild(card);
    });
}

/* JSON 파일로 내보내기 */

document.getElementById("export-data-button").addEventListener("click", function() {
    const data = getStoredData();

    const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "bps-data.json";
    link.click();

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 1000);
});

/* 터미널 */

function writeTerminal(text) {
    terminalOutput.textContent += "\n" + text;
    terminalOutput.scrollTop = terminalOutput.scrollHeight;
}

terminalInput.addEventListener("keydown", function(event) {
    if (event.key !== "Enter") {
        return;
    }

    const command = terminalInput.value.trim();
    terminalInput.value = "";

    if (!command) {
        return;
    }

    if (command === "clear") {
        terminalOutput.textContent = "BPS CONSOLE READY";
        return;
    }

    if (command === "help") {
        writeTerminal("help - 명령어 목록");
        writeTerminal("clear - 화면 지우기");
        writeTerminal("data - 저장된 데이터 개수 확인");
        return;
    }

    if (command === "data") {
        writeTerminal("저장된 데이터: " + getStoredData().length + "개");
        return;
    }

    writeTerminal("알 수 없는 명령어: " + command);
});

/* 첫 화면 초기화 */

showWelcome();
