
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#03070c">
  <title>BUPSENT</title>

  <style>
    /* =========================
       1. 기본 설정
    ========================= */

    :root {
      --bg: #03070c;
      --panel: #08121b;
      --cyan: #42f5ef;
      --blue: #3a9cff;
      --purple: #a78bfa;
      --text: #e9f7ff;
      --muted: #7f9ba9;
      --line: rgba(66, 245, 239, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      color: var(--text);
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(58, 156, 255, 0.13),
          transparent 48%
        ),
        radial-gradient(
          ellipse at 100% 55%,
          rgba(167, 139, 250, 0.06),
          transparent 45%
        ),
        var(--bg);

      font-family:
        system-ui, -apple-system, "Malgun Gothic",
        sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       2. 전체 레이아웃
    ========================= */

    #system {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       3. 제목
    ========================= */

    #title {
      margin: 40px 0 8px;

      color: var(--cyan);
      font-size: clamp(34px, 9vw, 43px);
      font-weight: 800;
      letter-spacing: 5px;
      line-height: 1.2;
      text-align: center;

      text-shadow:
        0 0 10px rgba(66, 245, 239, 0.38),
        0 0 30px rgba(66, 245, 239, 0.12);
    }

    #subtitle {
      margin: 0 0 30px;

      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-align: center;
    }

    /* 얇은 장식선 */
    #accent-line {
      width: 48px;
      height: 2px;
      margin: 0 0 26px;

      background: linear-gradient(
        90deg,
        var(--blue),
        var(--cyan),
        var(--purple)
      );

      border-radius: 2px;
      box-shadow: 0 0 12px rgba(66, 245, 239, 0.4);
    }

    /* =========================
       4. 입력 영역
    ========================= */

    #input-area {
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    #search {
      flex: 1;
      min-width: 0;
      min-height: 50px;
      max-height: 120px;
      padding: 14px 16px;

      color: var(--text);
      background: rgba(8, 18, 27, 0.94);

      border: 1px solid rgba(66, 245, 239, 0.27);
      border-radius: 17px;
      outline: none;

      font-size: 14px;
      line-height: 1.55;

      resize: none;
      overflow-y: auto;
      overflow-wrap: anywhere;

      box-shadow:
        inset 0 0 16px rgba(66, 245, 239, 0.025);

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }

    #search::placeholder {
      color: #78909e;
    }

    #search:focus {
      background: #091722;
      border-color: rgba(66, 245, 239, 0.75);

      box-shadow:
        0 0 0 3px rgba(66, 245, 239, 0.055),
        0 0 18px rgba(66, 245, 239, 0.07);
    }

    /* =========================
       5. 전송 버튼
    ========================= */

    #starting-button {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      padding: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      color: var(--cyan);
      background: linear-gradient(
        145deg,
        #102d39,
        #09121e
      );

      border: 1px solid rgba(66, 245, 239, 0.58);
      border-radius: 16px;

      box-shadow:
        0 0 14px rgba(66, 245, 239, 0.09),
        inset 0 0 10px rgba(66, 245, 239, 0.04);

      cursor: pointer;

      transition:
        transform 0.18s,
        border-color 0.18s,
        box-shadow 0.18s;
    }

    #starting-button:hover {
      border-color: var(--cyan);
      box-shadow:
        0 0 18px rgba(66, 245, 239, 0.19);
    }

    #starting-button:active {
      transform: scale(0.94);
    }

    #starting-button svg {
      width: 21px;
      height: 21px;
    }

    /* =========================
       6. 채팅창
    ========================= */

    #chatbox {
      width: 100%;
      height: 350px;
      margin-top: 18px;
      padding: 15px;

      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 13px;

      overflow-y: auto;
      overflow-x: hidden;
      overflow-wrap: anywhere;
      overscroll-behavior: contain;

      scrollbar-width: thin;
      scrollbar-color: #235d68 transparent;

      background:
        radial-gradient(
          ellipse at top left,
          rgba(66, 245, 239, 0.055),
          transparent 60%
        ),
        linear-gradient(
          155deg,
          rgba(9, 21, 32, 0.98),
          rgba(4, 9, 15, 0.99)
        );

      border: 1px solid var(--line);
      border-radius: 18px;

      box-shadow:
        0 0 22px rgba(66, 245, 239, 0.045),
        inset 0 0 24px rgba(66, 245, 239, 0.018);
    }

    /* =========================
       7. 시작 화면
    ========================= */

    #welcome {
      width: 100%;
      margin: auto 0;

      color: var(--muted);
      font-size: 12px;
      line-height: 2;
      letter-spacing: 1px;
      text-align: center;
    }

    #welcome span {
      display: block;
      margin-bottom: 9px;

      color: var(--cyan);
      font-size: 26px;

      text-shadow:
        0 0 14px rgba(66, 245, 239, 0.4);
    }

    #welcome strong {
      color: #c3dce8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    /* =========================
       8. 공통 말풍선
    ========================= */

    #chatbox p.message {
      width: fit-content;
      max-width: 88%;
      margin: 0;
      padding: 10px 14px;

      color: var(--text);
      font-size: 14px;
      line-height: 1.7;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;

      animation: messageAppear 0.22s ease-out;
    }

    /* 사용자 말풍선 */
    #chatbox p.user {
      align-self: flex-end;

      background: linear-gradient(
        135deg,
        rgba(29, 135, 160, 0.28),
        rgba(30, 75, 116, 0.23)
      );

      border: 1px solid rgba(66, 245, 239, 0.38);
      border-radius: 15px 15px 4px 15px;

      box-shadow:
        0 0 13px rgba(66, 245, 239, 0.035);
    }

    /* AI 말풍선 */
    #chatbox p.ai {
      align-self: flex-start;

      background: linear-gradient(
        135deg,
        rgba(22, 34, 54, 0.98),
        rgba(12, 20, 33, 0.98)
      );

      border: 1px solid rgba(167, 139, 250, 0.36);
      border-radius: 15px 15px 15px 4px;

      box-shadow:
        inset 2px 0 0 rgba(167, 139, 250, 0.22),
        0 0 13px rgba(167, 139, 250, 0.035);
    }

    /* =========================
       9. 애니메이션
    ========================= */

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       10. 작은 화면 대응
    ========================= */

    @media (max-width: 400px) {
      body {
        padding: 20px 13px;
      }

      #title {
        margin-top: 32px;
        letter-spacing: 4px;
      }

      #subtitle {
        margin-bottom: 25px;
      }

      #chatbox {
        height: 330px;
        padding: 12px;
      }

      #chatbox p.message {
        max-width: 92%;
        font-size: 13px;
      }
    }

    /* 움직임 줄이기 설정 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main id="system">

    <h1 id="title">BUPSENT</h1>
    <p id="subtitle">NEURAL INTERFACE</p>
    <div id="accent-line"></div>

    <div id="input-area">

      <textarea
        id="search"
        rows="1"
        placeholder="메시지를 입력하세요..."
        aria-label="메시지 입력"
      ></textarea>

      <button
        type="button"
        id="starting-button"
        aria-label="메시지 전송"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M22 2 11 13"></path>
          <path d="m22 2-7 20-4-9-9-4 20-7Z"></path>
        </svg>
      </button>

    </div>

    <div id="chatbox" aria-live="polite">

      <div id="welcome">
        <span>◈</span>
        <strong>BUPSENT INTERFACE</strong>
        <br>
        SYSTEM READY
      </div>

    </div>

  </main>

  <script>
    /* =========================
       1. HTML 요소 연결
    ========================= */

    const search = document.getElementById("search");
    const button = document.getElementById("starting-button");
    const chatbox = document.getElementById("chatbox");
    const welcome = document.getElementById("welcome");

    /* =========================
       2. 메시지 생성
    ========================= */

    function addMessage(text, type) {
      const message = document.createElement("p");

      message.classList.add("message", type);
      message.textContent = text;

      /* 새 메시지를 맨 위에 추가 */
      chatbox.prepend(message);

      return message;
    }

    /* =========================
       3. 입력창 크기 조절
    ========================= */

    function resizeInput() {
      search.style.height = "auto";

      const newHeight = Math.min(search.scrollHeight, 120);
      search.style.height = newHeight + "px";
      search.style.overflowY =
        search.scrollHeight > 120 ? "auto" : "hidden";
    }

    search.addEventListener("input", resizeInput);

    /* =========================
       4. 메시지 전송
    ========================= */

    function askAI() {
      const text = search.value.trim();

      /* 빈 메시지는 보내지 않음 */
      if (text === "") {
        search.focus();
        return;
      }

      /* 첫 메시지 전송 시 시작 안내 제거 */
      if (welcome.isConnected) {
        welcome.remove();
      }

      /* 사용자 메시지 표시 */
      addMessage(text, "user");

      /* 기존 BPS 응답 기능 유지 */
      if (text.toLowerCase() === "bps") {
        addMessage(
          "BPS AI 시스템에 접속했습니다.",
          "ai"
        );
      }

      /* 입력창 초기화 */
      search.value = "";
      resizeInput();
      search.focus();

      /* 최신 메시지가 있는 맨 위로 이동 */
      chatbox.scrollTop = 0;
    }

    /* =========================
       5. 버튼 및 키보드 이벤트
    ========================= */

    button.addEventListener("click", askAI);

    search.addEventListener("keydown", function(event) {
      /* Enter는 전송, Shift + Enter는 줄바꿈 */
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        askAI();
      }
    });
  </script>

</body>
</html>
