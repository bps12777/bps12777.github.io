<!DOCTYPE html>
<html>
  
<head>
  <title>BUPSENT</title>
<style>
  body{
   background:black;
   color:gray;
  }
  #system{
   display:flex;
   flex-direction:column;
   height:100vh;
   justify-content:center;
   align-items:center;
  }
  #searchbox{
   display:flex;
   flex-direction:row;
   justify-content:center;
   align-items:center;
   gap:3px;
  }
  #title{
   font-size:50px;
   color:darkturquoise;
   text-shadow:0px 0px 50px cyan;
  }
  #search{
   background:black;
   color:gray;
   width:250px;
   padding:5px;
   border:1px solid cyan;
   border-radius:3px;
  }
  #starting-button{
   background:black;
   color:gray;
   padding:5px;
   border:1px solid cyan;
   border-radius:3px;
  }
  
/* ===== BPS AI : NEON ORBIT ===== */

#chatbox {
  box-sizing: border-box;
  width: 350px;
  height: 300px;

  padding: 14px;
  margin-top: 20px;

  display: flex;
  flex-direction: column;
  gap: 12px;

  overflow-y: auto;
  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(0, 255, 255, 0.08),
      transparent 65%
    ),
    #05090d;

  border: 1px solid rgba(0, 255, 255, 0.45);
  border-radius: 14px;

  box-shadow:
    0 0 12px rgba(0, 255, 255, 0.08),
    inset 0 0 25px rgba(0, 255, 255, 0.035);

  scrollbar-color: #087e88 #05090d;
  scrollbar-width: thin;
}

/* 메시지 공통 디자인 */
#chatbox p {
  box-sizing: border-box;
  max-width: 85%;
  width: fit-content;

  padding: 11px 14px;
  margin: 0;

  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;

  animation: messageAppear 0.3s ease-out both;
}

/* 사용자 말풍선 */
#chatbox p.user {
  align-self: flex-end;

  color: #e3ffff;

  background:
    linear-gradient(
      135deg,
      rgba(0, 255, 255, 0.17),
      rgba(0, 90, 110, 0.12)
    );

  border: 1px solid rgba(0, 255, 255, 0.65);
  border-radius: 14px 14px 3px 14px;

  box-shadow:
    0 0 14px rgba(0, 255, 255, 0.08),
    inset 0 0 12px rgba(0, 255, 255, 0.035);
}

/* 메시지가 나타나는 애니메이션 */
@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
  
</head>

<body>
  <div id="system">
  <h1 id="title">BUPSENT</h1>
  <div id="searchbox">
  <input id="search" type="text" placeholder="Ask anything...">
  <button id="starting-button">@</button>
  </div>
  <div id="chatbox">
  </div>
  </div>
  
<script>
  const search = document.getElementById("search");
  const startingButton = document.getElementById("starting-button");
  function askAI() {
     alert(search.value);
  }
  startingButton.addEventListener("click", function() {
  askAI();
    });
  
  search.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
  askAI();
    }});
  const chatbox = document.getElementById("chatbox");
  function askAI() {
   if (search.value === "") {
   return;
   }
  const message = document.createElement("p");
message.classList.add("user");
message.textContent = "👤 " + search.value;
chatbox.prepend(message);
  search.value = "";
  chatbox.scrollTop = 0;
  }

</script>
  
</body>

</html>
