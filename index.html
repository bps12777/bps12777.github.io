
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUPSENT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(0, 206, 209, 0.09),
          transparent 45%
        ),
        #020507;

      color: white;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    /* 전체 시스템 */
    #system {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 제목 */
    #title {
      margin: 45px 0 8px;

      color: darkturquoise;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 4px;
      text-align: center;

      text-shadow:
        0 0 8px rgba(0, 206, 209, 0.7),
        0 0 24px rgba(0, 206, 209, 0.25);
    }

    /* 작은 부제목 */
    #subtitle {
      margin: 0 0 32px;

      color: #78999e;
      font-size: 12px;
      letter-spacing: 3px;
      text-align: center;
    }

    /* 입력창 + 전송 버튼 */
    #input-area {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #search {
      flex: 1;
      min-width: 0;
      height: 50px;
      padding: 0 17px;

      color: #eaffff;
      background: rgba(5, 15, 21, 0.95);

      border: 1px solid rgba(0, 206, 209, 0.55);
      border-radius: 26px;
      outline: none;

      font-size: 14px;

      box-shadow:
        inset 0 0 12px rgba(0, 206, 209, 0.035);

      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search::placeholder {
      color: #66858b;
    }

    #search:focus {
      border-color: darkturquoise;

      box-shadow:
        0 0 12px rgba(0, 206, 209, 0.18),
        inset 0 0 10px rgba(0, 206, 209, 0.04);
    }

    /* 전송 버튼 */
    #starting-button {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      padding: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      color: darkturquoise;
      background: linear-gradient(145deg, #102a31, #040b10);

      border: 1px solid rgba(0, 255, 255, 0.7);
      border-radius: 50%;

      box-shadow: 0 0 13px rgba(0, 255, 255, 0.12);

      cursor: pointer;
      transition: 0.2s;
    }

    #starting-button:hover {
      background: #10343b;
      box-shadow: 0 0 19px rgba(0, 255, 255, 0.25);
    }

    #starting-button:active {
      transform: scale(0.93);
    }

    #starting-button svg {
      width: 21px;
      height: 21px;
    }

    /* 채팅창 */
    #chatbox {
      width: 100%;
      height: 340px;
      margin-top: 22px;
      padding: 15px;

      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 13px;

      overflow-y: auto;
      overflow-x: hidden;
      overflow-wrap: anywhere;
      overscroll-behavior: contain;

      scrollbar-width: thin;
      scrollbar-color: #087d83 #050a0e;

      background:
        radial-gradient(
          ellipse at top left,
          rgba(0, 206, 209, 0.07),
          transparent 65%
        ),
        linear-gradient(160deg, #08131a, #03070a);

      border: 1px solid rgba(0, 255, 255, 0.48);
      border-radius: 17px;

      box-shadow:
        0 0 12px rgba(0, 255, 255, 0.09),
        inset 0 0 22px rgba(0, 206, 209, 0.035);
    }

    /* 시작 안내 */
    #welcome {
      width: 100%;
      margin: auto 0;

      color: #55777e;
      font-size: 12px;
      line-height: 1.9;
      text-align: center;
      letter-spacing: 1px;
    }

    #welcome span {
      display: block;
      margin-bottom: 8px;

      color: darkturquoise;
      font-size: 24px;

      text-shadow: 0 0 12px rgba(0, 206, 209, 0.4);
    }

    /* 공통 메시지 */
    #chatbox p.message {
      position: relative;

      width: fit-content;
      max-width: 88%;
      margin: 0;
      padding: 10px 14px;

      color: #e8ffff;
      font-size: 14px;
      line-height: 1.65;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;

      animation: messageAppear 0.22s ease-out;
    }

    /* 사용자 메시지 */
    #chatbox p.user {
      align-self: flex-end;

      background: linear-gradient(
        135deg,
        rgba(0, 206, 209, 0.23),
        rgba(0, 95, 110, 0.17)
      );

      border: 1px solid rgba(0, 255, 255, 0.48);
      border-radius: 15px 15px 3px 15px;

      box-shadow: 0 0 12px rgba(0, 255, 255, 0.045);
    }

    /* AI 메시지 */
    #chatbox p.ai {
      align-self: flex-start;

      background: linear-gradient(
        135deg,
        rgba(10, 39, 48, 0.96),
        rgba(4, 14, 21, 0.98)
      );

      border: 1px solid rgba(0, 206, 209, 0.4);
      border-radius: 15px 15px 15px 3px;

      box-shadow:
        inset 2px 0 0 rgba(0, 255, 255, 0.13),
        0 0 12px rgba(0, 206, 209, 0.045);
    }

    /* 메시지 등장 애니메이션 */
    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 모바일 화면 */
    @media (max-width: 400px) {
      body {
        padding: 20px 14px;
      }

      #title {
        margin-top: 35px;
        font-size: 36px;
      }

      #subtitle {
        margin-bottom: 27px;
      }

      #chatbox {
        height: 320px;
        padding: 12px;
      }

      #chatbox p.message {
        max-width: 92%;
        font-size: 13px;
      }
    }

    /* 애니메이션 최소화 설정 존중 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main id="system">

    <h1 id="title">BUPSENT</h1>
    <p id="subtitle">NEURAL INTERFACE</p>

    <div id="input-area">

      <input
        type="text"
        id="search"
        placeholder="메시지를 입력하세요..."
        autocomplete="off"
      >

      <button
        type="button"
        id="starting-button"
        aria-label="메시지 전송"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M22 2 11 13"></path>
          <path d="m22 2-7 20-4-9-9-4 20-7Z"></path>
        </svg>
      </button>

    </div>

    <div id="chatbox" aria-live="polite">

      <div id="welcome">
        <span>◈</span>
        BUPSENT INTERFACE<br>
        SYSTEM READY
      </div>

    </div>

  </main>

  <script>
    const search = document.getElementById("search");
    const button = document.getElementById("starting-button");
    const chatbox = document.getElementById("chatbox");
    const welcome = document.getElementById("welcome");

    /* 메시지 생성 */
    function addMessage(text, type) {
      const message = document.createElement("p");

      message.classList.add("message", type);
      message.textContent = text;

      chatbox.prepend(message);

      return message;
    }

    /* 메시지 전송 */
    function askAI() {
      const text = search.value.trim();

      if (text === "") {
        search.focus();
        return;
      }

      /* 첫 메시지를 보낼 때 시작 안내 제거 */
      if (welcome && welcome.isConnected) {
        welcome.remove();
      }

      /* 사용자 메시지를 채팅창 맨 위에 표시 */
      addMessage(text, "user");

      /* 기존 BPS 테스트 응답 유지 */
      if (text.toLowerCase() === "bps") {
        addMessage(
          "BPS AI 시스템에 접속했습니다.",
          "ai"
        );
      }

      /* 입력창 초기화 */
      search.value = "";
      search.focus();

      /* 최신 메시지가 있는 맨 위로 이동 */
      chatbox.scrollTop = 0;
    }

    /* 전송 버튼 클릭 */
    button.addEventListener("click", askAI);

    /* Enter 키로 전송 */
    search.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        askAI();
      }
    });
  </script>

</body>
</html>
