<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUPSENT</title>

<style>
:root {
    --bg: #03070c;
    --panel: #08121b;
    --cyan: #42f5ef;
    --blue: #3a9cff;
    --purple: #a78bfa;
    --text: #e9f7ff;
    --muted: #7f9ba9;
    --line: rgba(66, 245, 239, 0.22);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   메인 채팅 화면
========================= */

#system {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 35px 20px 24px;
    display: flex;
    flex-direction: column;
}

#header {
    text-align: center;
    margin: 45px 0 30px;
}

#title {
    margin: 0;
    color: var(--cyan);
    font-size: 50px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 18px rgba(66, 245, 239, 0.35);
}

#subtitle {
    margin-top: 9px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 4px;
}

#chatbox {
    width: 100%;
    min-height: 300px;
    flex: 1;
    margin: 0 auto 22px;
    padding: 16px;
    border: 1px solid var(--cyan);
    border-radius: 12px;
    background: rgba(8, 18, 27, 0.7);
    box-shadow: 0 0 14px rgba(66, 245, 239, 0.06);
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-wrap: anywhere;
}

#welcome {
    margin: auto 0;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
}

.message {
    max-width: 95%;
    margin: 0;
    padding: 10px 12px;
    border-radius: 9px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.user {
    align-self: flex-end;
    color: var(--text);
    background: rgba(58, 156, 255, 0.1);
    border: 1px solid rgba(58, 156, 255, 0.3);
}

.message.ai {
    align-self: flex-start;
    color: var(--text);
    background: rgba(66, 245, 239, 0.05);
    border: 1px solid var(--line);
}

/* 채팅 입력창 */

#input-area {
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 0 15px rgba(66, 245, 239, 0.04);
}

#search {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    max-height: 140px;
    padding: 10px 5px;
    resize: none;
    overflow-y: auto;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
}

#search::placeholder {
    color: var(--muted);
}

#starting-button {
    flex-shrink: 0;
    width: 42px;
    height: 40px;
    border: 1px solid var(--cyan);
    border-radius: 9px;
    background: rgba(66, 245, 239, 0.08);
    color: var(--cyan);
    font-size: 20px;
    font-weight: bold;
    transition: 0.2s;
}

#starting-button:hover {
    background: var(--cyan);
    color: var(--bg);
    box-shadow: 0 0 12px rgba(66, 245, 239, 0.25);
}

/* =========================
   공통 팝업
========================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.84);
}

.overlay.open {
    display: flex;
}

.window {
    width: 100%;
    max-width: 390px;
    max-height: 85vh;
    overflow-y: auto;
    margin: auto;
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #071018;
    box-shadow: 0 0 30px rgba(66, 245, 239, 0.08);
}

.window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
}

.window-header h2 {
    margin: 0;
    color: var(--cyan);
    font-size: 18px;
    font-weight: 600;
}

.close-button {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 24px;
}

.close-button:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
}

/* =========================
   비밀번호 창
========================= */

#password-window {
    width: 220px;
    max-width: calc(100vw - 40px);
    padding: 26px;
    text-align: center;
    overflow: hidden;
}

#password-input {
    display: block;
    width: 100%;
    height: 52px;
    margin: 0 auto;
    padding: 0 0 0 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    background: #03070c;
    color: var(--cyan);
    text-align: center;
    font-size: 25px;
    letter-spacing: 9px;
    caret-color: var(--cyan);
}

#password-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(66, 245, 239, 0.08);
}

#password-error {
    min-height: 12px;
    margin-top: 8px;
    font-size: 11px;
    color: #ff7777;
}

/* =========================
   데이터 창
========================= */

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 12px;
}

.field input,
.field textarea,
.field select {
    display: block;
    width: 100%;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
    background: #03070c;
    color: var(--text);
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    border-color: var(--cyan);
}

.field textarea {
    min-height: 78px;
    resize: vertical;
}

.primary-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: var(--cyan);
    color: #001012;
    font-weight: bold;
}

.primary-button:hover {
    background: #a1fffb;
}

.secondary-button {
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--cyan);
    font-size: 12px;
}

#terminal-status {
    min-height: 18px;
    margin: 12px 0;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
}

.data-list {
    margin-top: 20px;
    border-top: 1px solid var(--line);
}

.data-item {
    padding: 13px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.data-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
}

.data-type {
    color: var(--cyan);
    font-size: 11px;
}

.delete-button {
    border: none;
    background: transparent;
    color: #ff8585;
    font-size: 12px;
}

.data-content {
    margin: 0 0 5px;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.data-meaning {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.empty-list {
    padding: 22px 0;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
}

/* =========================
   터미널 창
========================= */

#console-window {
    max-width: 500px;
    background: #020608;
    border-color: rgba(66, 245, 239, 0.35);
}

#console-output {
    min-height: 170px;
    max-height: 38vh;
    overflow-y: auto;
    margin-bottom: 12px;
    color: var(--cyan);
    font-family: monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.console-line {
    margin-bottom: 4px;
}

#console-form {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: monospace;
}

.console-prompt {
    color: var(--cyan);
}

#console-input {
    flex: 1;
    min-width: 0;
    padding: 10px 0;
    border: none;
    border-bottom: 1px solid var(--line);
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: monospace;
    font-size: 14px;
}

#console-run {
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    color: var(--cyan);
    font-size: 12px;
}

@media (max-width: 360px) {
    #system {
        padding: 25px 12px 18px;
    }

    #title {
        font-size: 42px;
    }

    #chatbox {
        padding: 12px;
    }

    .window {
        padding: 17px;
    }
}
</style>
</head>

<body>

<main id="system">

    <header id="header">
        <h1 id="title">BUPSENT</h1>
        <div id="subtitle">NEURAL INTERFACE</div>
    </header>

    <section id="chatbox" aria-live="polite">
        <div id="welcome">
            BPS AI 시스템에 접속할 준비가 되었습니다.
        </div>
    </section>

    <form id="input-area">
        <textarea
            id="search"
            rows="1"
            placeholder="Ask anything..."
            aria-label="메시지 입력"
        ></textarea>

        <button
            id="starting-button"
            type="submit"
            aria-label="메시지 전송"
        >@</button>
    </form>

</main>


<!-- 비밀번호 창 -->

<div class="overlay" id="password-overlay">
    <section
        class="window"
        id="password-window"
        role="dialog"
        aria-modal="true"
        aria-label="비밀번호 입력"
    >
        <input
            id="password-input"
            type="password"
            inputmode="text"
            maxlength="4"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="비밀번호"
        >

        <div id="password-error"></div>
    </section>
</div>


<!-- 데이터 관리 창 -->

<div class="overlay" id="data-overlay">
    <section
        class="window"
        id="data-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="data-title"
    >
        <div class="window-header">
            <h2 id="data-title">BPS DATA</h2>

            <button
                class="close-button"
                type="button"
                data-close="data-overlay"
                aria-label="닫기"
            >×</button>
        </div>

        <form id="data-form">
            <div class="field">
                <label for="data-type">DATA TYPE</label>

                <select id="data-type">
                    <option value="word">단어</option>
                    <option value="sentence">문장</option>
                    <option value="knowledge">지식</option>
                </select>
            </div>

            <div class="field">
                <label for="data-content">CONTENT</label>

                <textarea
                    id="data-content"
                    maxlength="2000"
                    required
                    placeholder="저장할 내용을 입력하세요"
                ></textarea>
            </div>

            <div class="field">
                <label for="data-meaning">MEANING</label>

                <textarea
                    id="data-meaning"
                    maxlength="5000"
                    placeholder="의미 또는 설명을 입력하세요"
                ></textarea>
            </div>

            <button class="primary-button" type="submit">
                SAVE DATA
            </button>
        </form>

        <div id="terminal-status" role="status"></div>

        <div class="window-header">
            <h2>STORED DATA</h2>

            <button
                class="secondary-button"
                id="export-button"
                type="button"
            >EXPORT JSON</button>
        </div>

        <div id="data-list" class="data-list"></div>
    </section>
</div>


<!-- 터미널 창 -->

<div class="overlay" id="console-overlay">
    <section
        class="window"
        id="console-window"
        role="dialog"
        aria-modal="true"
        aria-labelledby="console-title"
    >
        <div class="window-header">
            <h2 id="console-title">BPS CONSOLE</h2>

            <button
                class="close-button"
                type="button"
                data-close="console-overlay"
                aria-label="닫기"
            >×</button>
        </div>

        <div id="console-output" aria-live="polite"></div>

        <form id="console-form">
            <span class="console-prompt">&gt;</span>

            <input
                id="console-input"
                type="text"
                autocomplete="off"
                placeholder="명령어 입력"
                aria-label="터미널 명령어"
            >

            <button id="console-run" type="submit">RUN</button>
        </form>
    </section>
</div>


<script>
/* =========================
   요소 연결 및 설정
========================= */

const search = document.getElementById("search");
const chatbox = document.getElementById("chatbox");
const welcome = document.getElementById("welcome");

const passwordOverlay = document.getElementById("password-overlay");
const passwordInput = document.getElementById("password-input");
const passwordError = document.getElementById("password-error");

const dataOverlay = document.getElementById("data-overlay");
const dataForm = document.getElementById("data-form");
const dataType = document.getElementById("data-type");
const dataContent = document.getElementById("data-content");
const dataMeaning = document.getElementById("data-meaning");
const dataList = document.getElementById("data-list");
const terminalStatus = document.getElementById("terminal-status");

const consoleOverlay = document.getElementById("console-overlay");
const consoleOutput = document.getElementById("console-output");
const consoleForm = document.getElementById("console-form");
const consoleInput = document.getElementById("console-input");

const STORAGE_KEY = "BUPSENT_DATA_V1";
const DATA_PASSWORD = "3868";

let pendingDestination = null;
let previousFocus = null;


/* =========================
   채팅 기능
========================= */

function addMessage(text, type) {
    if (welcome.isConnected) {
        welcome.remove();
    }

    const message = document.createElement("p");
    message.className = "message " + type;
    message.textContent = text;

    chatbox.appendChild(message);
    chatbox.scrollTop = chatbox.scrollHeight;
}

function resizeInput() {
    search.style.height = "auto";

    search.style.height =
        Math.min(search.scrollHeight, 140) + "px";
}

function askAI() {
    const text = search.value.trim();

    if (!text) return;

    const command = text.toLowerCase();

    search.value = "";
    resizeInput();

    if (command === "/bps data") {
        openPasswordWindow("data");
        return;
    }

    if (command === "/bps console") {
        openPasswordWindow("console");
        return;
    }

    addMessage("👤 " + text, "user");

    if (command === "bps") {
        addMessage(
            "BPS AI 시스템에 접속했습니다.",
            "ai"
        );
    } else {
        addMessage(
            "현재는 기본 채팅 인터페이스입니다. AI 기능은 이후 연결할 수 있습니다.",
            "ai"
        );
    }

    search.focus();
}

document
    .getElementById("input-area")
    .addEventListener("submit", function(event) {
        event.preventDefault();
        askAI();
    });

search.addEventListener("input", resizeInput);

search.addEventListener("keydown", function(event) {
    if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
    ) {
        event.preventDefault();
        askAI();
    }
});


/* =========================
   팝업 열기 및 닫기
========================= */

function openOverlay(overlay, focusElement) {
    previousFocus = document.activeElement;

    overlay.classList.add("open");

    if (focusElement) {
        setTimeout(function() {
            focusElement.focus();
        }, 80);
    }
}

function closeOverlay(overlay) {
    overlay.classList.remove("open");

    if (overlay === passwordOverlay) {
        passwordInput.value = "";
        passwordError.textContent = "";
        pendingDestination = null;
    }

    if (previousFocus && typeof previousFocus.focus === "function") {
        previousFocus.focus();
    }
}

document.querySelectorAll("[data-close]").forEach(function(button) {
    button.addEventListener("click", function() {
        const overlay = document.getElementById(
            button.dataset.close
        );

        closeOverlay(overlay);
    });
});

[
    passwordOverlay,
    dataOverlay,
    consoleOverlay
].forEach(function(overlay) {
    overlay.addEventListener("click", function(event) {
        if (event.target === overlay) {
            closeOverlay(overlay);
        }
    });
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        const opened = document.querySelector(".overlay.open");

        if (opened) {
            closeOverlay(opened);
        }
    }
});


/* =========================
   비밀번호 인증
========================= */

function openPasswordWindow(destination) {
    pendingDestination = destination;

    passwordInput.value = "";
    passwordError.textContent = "";

    openOverlay(passwordOverlay, passwordInput);
}

passwordInput.addEventListener("input", function() {
    // 숫자만 허용하고 최대 4자리로 제한
    passwordInput.value = passwordInput.value
        .replace(/\D/g, "")
        .slice(0, 4);

    passwordError.textContent = "";
});

passwordInput.addEventListener("keydown", function(event) {
    if (event.key !== "Enter") return;

    event.preventDefault();

    if (passwordInput.value.length !== 4) {
        return;
    }

    if (passwordInput.value === DATA_PASSWORD) {
        const destination = pendingDestination;

        passwordOverlay.classList.remove("open");
        passwordInput.value = "";
        passwordError.textContent = "";
        pendingDestination = null;

        if (destination === "data") {
            openDataConsole();
        } else if (destination === "console") {
            openConsole();
        }

    } else {
        // 잘못된 비밀번호는 표시하지 않고 입력 칸만 초기화
        passwordInput.value = "";
        passwordError.textContent = "";
        passwordInput.focus();
    }
});


/* =========================
   데이터 불러오기 및 저장
========================= */

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) return [];

        const parsed = JSON.parse(saved);

        return Array.isArray(parsed) ? parsed : [];

    } catch (error) {
        return [];
    }
}

function saveData(items) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(items)
    );
}

function setTerminalStatus(text) {
    terminalStatus.textContent = text;
}

function openDataConsole() {
    renderDataList();
    setTerminalStatus("");

    openOverlay(dataOverlay, dataContent);
}

dataForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const type = dataType.value;
    const content = dataContent.value.trim();
    const meaning = dataMeaning.value.trim();

    if (!content) {
        setTerminalStatus("내용을 입력하세요.");
        return;
    }

    const items = loadData();

    const duplicate = items.some(function(item) {
        return (
            item.type === type &&
            item.content.toLowerCase() === content.toLowerCase()
        );
    });

    if (duplicate) {
        setTerminalStatus(
            "같은 유형과 내용의 데이터가 이미 있습니다."
        );
        return;
    }

    const newItem = {
        id:
            Date.now().toString() +
            Math.random().toString(16).slice(2),

        type: type,
        content: content,
        meaning: meaning,
        createdAt: new Date().toISOString()
    };

    items.unshift(newItem);

    try {
        saveData(items);

        dataContent.value = "";
        dataMeaning.value = "";

        setTerminalStatus("데이터를 저장했습니다.");
        renderDataList();
        dataContent.focus();

    } catch (error) {
        setTerminalStatus(
            "저장에 실패했습니다. 브라우저 저장 공간을 확인하세요."
        );
    }
});


/* =========================
   저장된 데이터 표시
========================= */

function renderDataList() {
    const items = loadData();

    dataList.replaceChildren();

    if (items.length === 0) {
        const empty = document.createElement("div");

        empty.className = "empty-list";
        empty.textContent = "저장된 데이터가 없습니다.";

        dataList.appendChild(empty);
        return;
    }

    items.forEach(function(item) {
        const container = document.createElement("article");
        container.className = "data-item";

        const top = document.createElement("div");
        top.className = "data-item-top";

        const type = document.createElement("span");
        type.className = "data-type";

        const typeNames = {
            word: "단어",
            sentence: "문장",
            knowledge: "지식"
        };

        type.textContent = typeNames[item.type] || item.type;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "삭제";

        deleteButton.addEventListener("click", function() {
            deleteData(item.id);
        });

        top.append(type, deleteButton);

        const content = document.createElement("p");
        content.className = "data-content";
        content.textContent = item.content;

        const meaning = document.createElement("p");
        meaning.className = "data-meaning";
        meaning.textContent = item.meaning || "설명 없음";

        container.append(top, content, meaning);

        dataList.appendChild(container);
    });
}

function deleteData(id) {
    const items = loadData().filter(function(item) {
        return item.id !== id;
    });

    try {
        saveData(items);
        renderDataList();
        setTerminalStatus("데이터를 삭제했습니다.");

    } catch (error) {
        setTerminalStatus("삭제에 실패했습니다.");
    }
}


/* =========================
   JSON 파일 내보내기
========================= */

document
    .getElementById("export-button")
    .addEventListener("click", function() {
        const items = loadData();

        const blob = new Blob(
            [JSON.stringify(items, null, 2)],
            {
                type: "application/json;charset=utf-8"
            }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "bps-data.json";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(function() {
            URL.revokeObjectURL(url);
        }, 1000);

        setTerminalStatus("JSON 파일 내보내기를 요청했습니다.");
    });


/* =========================
   터미널 기능
========================= */

function printConsole(text) {
    const line = document.createElement("div");

    line.className = "console-line";
    line.textContent = text;

    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
}

function openConsole() {
    consoleOutput.replaceChildren();

    printConsole("BPS AI Console");
    printConsole("터미널 인터페이스가 시작되었습니다.");
    printConsole("사용 가능한 명령어: help, clear, data");
    printConsole("");

    openOverlay(consoleOverlay, consoleInput);
}

consoleForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const command = consoleInput.value.trim().toLowerCase();

    if (!command) return;

    printConsole("> " + command);

    consoleInput.value = "";

    if (command === "help") {
        printConsole("help  - 사용 가능한 명령어");
        printConsole("clear - 터미널 화면 지우기");
        printConsole("data  - 저장된 데이터 개수 확인");

    } else if (command === "clear") {
        consoleOutput.replaceChildren();

    } else if (command === "data") {
        printConsole(
            "저장된 데이터: " + loadData().length + "개"
        );

    } else {
        printConsole(
            "알 수 없는 명령어입니다. help를 입력하세요."
        );
    }
});
</script>
